"$schema" = 'https://starship.rs/config-schema.json'
format = """
$directory\
$vcs\
$cmd_duration\
$fill\
$localip\
$shlvl\
$singularity\
$kubernetes\
$nats\
$vcsh\
$cmake\
$cobol\
$cpp\
$daml\
$deno\
$erlang\
$fennel\
$fortran\
$gleam\
$golang\
$gradle\
$haskell\
$haxe\
$helm\
$kotlin\
$maven\
$mojo\
$nim\
$ocaml\
$odin\
$opa\
$perl\
$php\
$pulumi\
$purescript\
$quarto\
$raku\
$rlang\
$red\
$ruby\
$scala\
$solidity\
$terraform\
$typst\
$vlang\
$vagrant\
$xmake\
$zig\
$buf\
$guix_shell\
$nix_shell\
$conda\
$pixi\
$meson\
$spack\
$memory_usage\
$aws\
$openstack\
$azure\
$direnv\
$env_var\
$mise\
$crystal\
$custom\
$sudo\
$line_break\
$jobs\
$battery\
$time\
$status\
$container\
$netns\
$shell\
$username\
$hostname\
$character"""

[kubernetes]
format = ' [$symbol$context( \($namespace\))]($style) '

[vcs]
order = ["jj", "git"]

[gcloud]
disabled = true

[aws]
format = 'on [$symbol$region]($style) '
style = 'bold yellow'
symbol = "  "

[aws.region_aliases]
ap-southeast-2 = 'au'
us-east-1 = 'va'
us-east-2 = 'oh'

[bun]
disabled = true

[buf]
symbol = " "

[c]
disabled = true
symbol = " "

[conda]
symbol = " "

[dart]
disabled = true
symbol = " "

[directory]
read_only = " 󰌾"

[docker_context]
disabled = true
symbol = " "

[dotnet]
disabled = true

[elixir]
disabled = true
symbol = " "

[elm]
disabled = true
symbol = " "

[fossil_branch]
symbol = " "

[golang]
symbol = " "

[guix_shell]
symbol = " "

[haskell]
symbol = " "

[haxe]
symbol = "⌘ "

[hg_branch]
symbol = " "

[hostname]
ssh_symbol = " "
format = '[$ssh_symbol]($style)[$hostname]($style) '

[username]
format = '[$user]($style) on '

[java]
disabled = true
symbol = " "

[julia]
disabled = true
symbol = " "

[lua]
disabled = true
symbol = " "

[memory_usage]
symbol = "󰍛 "

[meson]
symbol = "󰔷 "

[nim]
symbol = "󰆥 "

[nix_shell]
symbol = ""
format = '[$symbol dev]($style) '

[nodejs]
disabled = true
symbol = " "

[os]
disabled = true

[os.symbols]
Alpine = " "
Amazon = " "
Android = " "
Arch = " "
CentOS = " "
Debian = " "
DragonFly = " "
Emscripten = " "
EndeavourOS = " "
Fedora = " "
FreeBSD = " "
Garuda = "󰛓 "
Gentoo = " "
HardenedBSD = "󰞌 "
Illumos = "󰈸 "
Linux = " "
Macos = " "
Manjaro = " "
Mariner = " "
MidnightBSD = " "
Mint = " "
NetBSD = " "
NixOS = " "
OpenBSD = "󰈺 "
openSUSE = " "
OracleLinux = "󰌷 "
Pop = " "
Raspbian = " "
Redhat = " "
RedHatEnterprise = " "
Redox = "󰀘 "
Solus = "󰠳 "
SUSE = " "
Ubuntu = " "
Unknown = " "
Windows = "󰍲 "

[package]
symbol = "󰏗 "
format = 'via [$symbol$version]($style) '
disabled = true

[pijul_channel]
symbol = "🪺 "

[python]
disabled = true
symbol = " "

[rlang]
symbol = "󰟔 "

[ruby]
symbol = " "

[rust]
disabled = true
symbol = " "

[scala]
symbol = " "

[spack]
symbol = "🅢 "

[swift]
disabled = true
