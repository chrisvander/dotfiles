"$schema" = 'https://starship.rs/config-schema.json'
format = "$directory${custom.jj}$git_branch$git_commit$git_state$git_status$cmd_duration$fill$all$character$prompt"

[kubernetes]
format = ' [$symbol$context( \($namespace\))]($style) '

[git_branch]
disabled = true
format = '[$symbol$branch(:$remote_branch)]($style) '
truncation_length = 8
symbol = " "

[git_commit]
disabled = true

[git_state]
disabled = true

[git_status]
disabled = true

[custom.jj]
command = "jj-starship --bookmarks-display-limit 2 --truncate-name 14 --strip-bookmark-prefix \"chris/eng-\" --no-git-prefix --no-jj-prefix --no-git-id"
shell = ["sh"]
format = "$output "
when = "jj-starship detect"

[gcloud]
disabled = true

[aws]
format = 'on [$symbol$region]($style) '
style = 'bold yellow'
symbol = "  "

[aws.region_aliases]
ap-southeast-2 = 'au'
us-east-1 = 'va'
us-east-2 = 'oh'

[bun]
disabled = true

[buf]
symbol = " "

[c]
disabled = true
symbol = " "

[conda]
symbol = " "

