[language-server]
biome = { command = "bunx", args = ["biome", "lsp-proxy"] }

[language-server.astro-ls]
args = ["--stdio"]
command = "astro-ls"
config = { typescript = { tsdk = ".local/share/pnpm/global/5/node_modules/typescript/lib" } }

[[language]]
name = "astro"
scope = "source.astro"
injection-regex = "astro"
file-types = ["astro"]
language-servers = ["astro-ls"]
formatter = { command = "prettier", args = ["--plugin", "prettier-plugin-astro", "--parser", "astro"] }
auto-format = true

[[language]]
name = "typescript"
language-servers = [ { name = "typescript-language-server", except-features = [ "format" ] }, "biome"]
indent = { tab-width = 2, unit = " " }
auto-format = true

[[language]]
name = "tsx"
language-servers = [ { name = "typescript-language-server", except-features = [ "format" ] }, "biome"]
indent = { tab-width = 2, unit = " " }
auto-format = true

[[language]]
name = "jsx"
language-servers = [ { name = "typescript-language-server", except-features = [ "format" ] }, "biome"]
grammar = "javascript"
indent = { tab-width = 2, unit = " " }
auto-format = true

[[language]]
name = "javascript"
language-servers = [ { name = "typescript-language-server", except-features = [ "format" ] }, "biome"]
indent = { tab-width = 2, unit = " " }
auto-format = true

[[language]]
name = "json"
language-servers = [ { name = "typescript-language-server", except-features = [ "format" ] }, "biome"]
indent = { tab-width = 2, unit = " " }
auto-format = true
